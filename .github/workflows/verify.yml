name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r requirements-dev.txt
      - name: Seed GenVM SDK cache
        env:
          GENVM_SDK_SHA256: 4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/gltest-direct
          curl -fsSL --retry 3 -o ~/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz \
            https://github.com/genlayerlabs/genvm/releases/download/v0.2.16/genvm-universal.tar.xz
          echo "${GENVM_SDK_SHA256}  ${HOME}/.cache/gltest-direct/genvm-universal-v0.2.16.tar.xz" | sha256sum -c -
      - run: python scripts/preflight.py
      - run: python -m pytest tests/direct -q
      - run: python -m py_compile contracts/archivefuse.py
      - run: genvm-lint check contracts/archivefuse.py --json
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
